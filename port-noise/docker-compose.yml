services:
  port-noise:
    build: .
    image: port-noise-review:latest
    container_name: port-noise-review
    ports:
      - "8000:8000"
    volumes:
      - port_noise_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  port_noise_data:
