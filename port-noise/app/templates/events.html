{% extends "base.html" %}
{% block title %}事件流水{% endblock %}
{% block content %}
<h2>事件流水（入库先后即核定先后）</h2>
<table>
  <thead><tr><th>序号</th><th>类型</th><th>明细</th></tr></thead>
  <tbody>
  {% for eid, kind, detail in events %}
    <tr><td>#{{ eid }}</td><td>{{ kind }}</td><td><code>{{ detail | tojson }}</code></td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
